<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Paddy Farming Experience</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div id="hud">
    <div class="title">🌾 VR Paddy Farming Experience</div>
    <div class="help">🖱️ Look Around &nbsp; | &nbsp; WASD Move &nbsp; | &nbsp; 🥽 Enter VR</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: true; enterVRButton: true"
    webxr="referenceSpaceType: local-floor; requiredFeatures: local-floor; optionalFeatures: bounded-floor, hand-tracking"
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
    fog="type: exponential; color: #9ed9f5; density: 0.012"
    shadow="type: pcfsoft">

    <a-assets>
      <a-mixin id="paddy" geometry="primitive: cone; radiusBottom: 0.07; radiusTop: 0.015; height: 0.9"
               material="color: #3d9b35; roughness: 0.9"></a-mixin>
    </a-assets>

    <!-- ================= ENVIRONMENT ================= -->
    <a-sky color="#86cffa"></a-sky>

    <a-light type="ambient" intensity="1.0" color="#fff8df"></a-light>
    <a-light type="directional" intensity="2.0" position="-15 25 10"
             castShadow="true" shadow-mapSize="2048"></a-light>

    <a-sphere position="18 22 -28" radius="3"
              material="color:#ffe16b; emissive:#ffe16b; emissiveIntensity:1.5"></a-sphere>

    <a-plane rotation="-90 0 0" width="90" height="90"
             material="color:#5f9b43; roughness:1"></a-plane>

    <!-- Mountains -->
    <a-entity id="mountains"></a-entity>

    <!-- ================= PADDY FIELDS ================= -->
    <a-entity id="fields">
      <a-plane position="0 0.02 -7" rotation="-90 0 0" width="48" height="11"
               material="color:#4f8f38; roughness:1"></a-plane>
      <a-plane position="0 0.02 7" rotation="-90 0 0" width="48" height="11"
               material="color:#568f39; roughness:1"></a-plane>

      <!-- Muddy central ploughing field -->
      <a-plane position="0 0.035 0" rotation="-90 0 0" width="45" height="10"
               material="color:#765536; roughness:1"></a-plane>

      <!-- Water channels -->
      <a-plane class="water" position="0 0.07 -12.7" rotation="-90 0 0"
               width="50" height="1.7"></a-plane>
      <a-plane class="water" position="0 0.07 12.7" rotation="-90 0 0"
               width="50" height="1.7"></a-plane>
      <a-plane class="water" position="22 0.075 0" rotation="-90 0 0"
               width="3" height="26"></a-plane>
    </a-entity>

    <a-entity id="paddyRows"></a-entity>

    <!-- ================= TREES ================= -->
    <a-entity id="trees"></a-entity>

    <!-- ================= FARMHOUSE ================= -->
    <a-entity position="19 0 5">
      <a-box position="0 2 0" width="5.5" height="4" depth="4"
             material="color:#e8c875; roughness:0.9"
             shadow="cast:true; receive:true"></a-box>
      <a-cone position="0 4.8 0" radius-bottom="4.2" radius-top="0.15"
              height="2.2" material="color:#9d4b2b; roughness:1"></a-cone>
      <a-box position="0 1 2.05" width="1.1" height="2.1" depth="0.12"
             material="color:#5b3824"></a-box>
      <a-box position="-1.55 2.1 2.05" width="0.9" height="0.8" depth="0.1"
             material="color:#9ed8e5"></a-box>
      <a-box position="1.55 2.1 2.05" width="0.9" height="0.8" depth="0.1"
             material="color:#9ed8e5"></a-box>
    </a-entity>

    <!-- ================= FARMER PLOUGHING ================= -->
    <a-entity id="ploughTeam" position="-15 0 0">
      <a-entity class="ploughAnim">

        <!-- Farmer -->
        <a-entity position="-2.4 0 0">
          <a-cylinder position="0 1.45 0" radius="0.34" height="1.35"
                       material="color:#f3f1e7"></a-cylinder>
          <a-sphere position="0 2.42 0" radius="0.38"
                    material="color:#a9653e"></a-sphere>
          <a-cylinder position="0 2.75 0" radius="0.55" height="0.12"
                       material="color:#d6aa4b"></a-cylinder>
          <a-cylinder position="-0.17 0.45 0" radius="0.12" height="0.9"
                       material="color:#563923"></a-cylinder>
          <a-cylinder position="0.17 0.45 0" radius="0.12" height="0.9"
                       material="color:#563923"></a-cylinder>
          <a-cylinder position="-0.48 1.55 0" radius="0.09" height="0.9"
                       rotation="0 0 -55" material="color:#a9653e"></a-cylinder>
          <a-cylinder position="0.48 1.55 0" radius="0.09" height="0.9"
                       rotation="0 0 55" material="color:#a9653e"></a-cylinder>
        </a-entity>

        <!-- Ox 1 -->
        <a-entity position="0 0.55 0">
          <a-box position="0 1 0" width="2.2" height="1.15" depth="1"
                 material="color:#d6c7a8"></a-box>
          <a-box position="1.15 1.2 0" width="0.8" height="0.85" depth="0.8"
                 material="color:#c4b18c"></a-box>
          <a-cone position="1.48 1.72 0.34" radius-bottom="0.12" radius-top="0"
                   height="0.75" rotation="0 0 -55"
                   material="color:#f3e5b7"></a-cone>
          <a-cone position="1.48 1.72 -0.34" radius-bottom="0.12" radius-top="0"
                   height="0.75" rotation="0 0 -55"
                   material="color:#f3e5b7"></a-cone>
          <a-cylinder position="-0.65 0.25 0.35" radius="0.12" height="0.75"
                       material="color:#725035"></a-cylinder>
          <a-cylinder position="0.65 0.25 0.35" radius="0.12" height="0.75"
                       material="color:#725035"></a-cylinder>
          <a-cylinder position="-0.65 0.25 -0.35" radius="0.12" height="0.75"
                       material="color:#725035"></a-cylinder>
          <a-cylinder position="0.65 0.25 -0.35" radius="0.12" height="0.75"
                       material="color:#725035"></a-cylinder>
        </a-entity>

        <!-- Ox 2 -->
        <a-entity position="2.8 0.55 0">
          <a-box position="0 1 0" width="2.2" height="1.15" depth="1"
                 material="color:#87552f"></a-box>
          <a-box position="1.15 1.2 0" width="0.8" height="0.85" depth="0.8"
                 material="color:#704321"></a-box>
          <a-cone position="1.48 1.72 0.34" radius-bottom="0.12" radius-top="0"
                   height="0.75" rotation="0 0 -55"
                   material="color:#f3e5b7"></a-cone>
          <a-cone position="1.48 1.72 -0.34" radius-bottom="0.12" radius-top="0"
                   height="0.75" rotation="0 0 -55"
                   material="color:#f3e5b7"></a-cone>
          <a-cylinder position="-0.65 0.25 0.35" radius="0.12" height="0.75"
                       material="color:#56351f"></a-cylinder>
          <a-cylinder position="0.65 0.25 0.35" radius="0.12" height="0.75"
                       material="color:#56351f"></a-cylinder>
          <a-cylinder position="-0.65 0.25 -0.35" radius="0.12" height="0.75"
                       material="color:#56351f"></a-cylinder>
          <a-cylinder position="0.65 0.25 -0.35" radius="0.12" height="0.75"
                       material="color:#56351f"></a-cylinder>
        </a-entity>

        <!-- Wooden plough -->
        <a-box position="0.6 0.65 0" width="5.8" height="0.14" depth="0.14"
               rotation="0 0 -4" material="color:#5b3925"></a-box>
        <a-box position="-1.4 1.2 0" width="0.12" height="1.5" depth="0.12"
               rotation="0 0 -20" material="color:#5b3925"></a-box>
        <a-cone position="3.75 0.32 0" radius-bottom="0.45" radius-top="0"
                height="1.2" rotation="0 0 -90"
                material="color:#4d2f21"></a-cone>

      </a-entity>
    </a-entity>

    <!-- ================= COWS ================= -->
    <a-entity id="cows"></a-entity>

    <!-- ================= BIRDS ================= -->
    <a-entity id="birds"></a-entity>

    <!-- ================= ENHANCED VILLAGE ================= -->
    <a-entity id="villagePaths"></a-entity>
    <a-entity id="villageHouses"></a-entity>
    <a-entity id="extraFarmers"></a-entity>
    <a-entity id="extraAnimals"></a-entity>
    <a-entity id="farmEquipment"></a-entity>
    <a-entity id="grassLayer"></a-entity>
    <a-entity id="extraTrees"></a-entity>
    <a-entity id="bridges"></a-entity>
    <a-entity id="clouds"></a-entity>

    <!-- ================= CAMERA ================= -->
    <a-entity id="rig" position="0 1.6 19">
      <a-camera
        look-controls="pointerLockEnabled: true"
        wasd-controls="acceleration: 18"
        position="0 0 0">
        <a-cursor color="#ffffff" fuse="false"></a-cursor>
      </a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
